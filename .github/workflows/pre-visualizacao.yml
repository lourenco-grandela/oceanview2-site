# Publicação no GitHub Pages (site v3), em dois modos:
#
# - DOMÍNIO (há CNAME): o site é construído com --publicar, sem noindex, com
#   robots.txt, sitemap.xml (com hreflang) e CNAME.
# - PRÉ-VISUALIZAÇÃO (não há CNAME): em https://<utilizador>.github.io/<repositório>/,
#   com noindex em todas as páginas e robots.txt a fechar tudo.
#
# O site é gerado por ferramentas/construir.py (Python, sem dependências) a
# partir de src/, data/, assets/ e config.js. Só a pasta _site/ é publicada
# (nada de docs/, content/, formulario/, ferramentas/, referencia-v3/ nem src/).
# Ver src/LEIA-ME.md e docs/LANCAMENTO.md.
#
# Corre só em pushes para main: o ramo v3 não publica nada até ser aprovado e
# juntado ao main.
name: Publicação (pré-visualização ou domínio)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construir o site
        run: |
          if [ -f CNAME ]; then
            echo "Modo: DOMÍNIO ($(cat CNAME))"
            python3 ferramentas/construir.py --publicar
          else
            echo "Modo: PRÉ-VISUALIZAÇÃO (noindex)"
            python3 ferramentas/construir.py --base "/${{ github.event.repository.name }}/"
          fi

      - name: Verificar antes de publicar
        run: |
          test -f _site/index.html -a -f _site/en/index.html -a -f _site/404.html
          # Nada por preencher visível nas páginas.
          if grep -rl 'TODO-dominio\|class="todo"' _site --include=*.html; then
            echo "Há marcadores por preencher: não se publica."; exit 1
          fi
          # Sem CNAME, todas as páginas levam noindex.
          if [ ! -f CNAME ]; then
            for f in $(find _site -name '*.html'); do
              grep -q 'content="noindex, nofollow"' "$f" || { echo "Falta o noindex em $f"; exit 1; }
            done
          fi
          # Nenhum dado pessoal do lançamento no site.
          test ! -e _site/dados-lancamento.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: publicacao
        uses: actions/deploy-pages@v4
