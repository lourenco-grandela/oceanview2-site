<!doctype html>
<html lang="{% pt %}pt-PT{% en %}en-GB{% fim %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulo }} · OceanView 2</title>
<meta name="description" content="{{ descricao }}">
{{ robots }}
<link rel="canonical" href="{{ abs_atual }}">
<link rel="alternate" hreflang="pt-PT" href="{{ abs_pt }}">
<link rel="alternate" hreflang="en-GB" href="{{ abs_en }}">
<link rel="alternate" hreflang="x-default" href="{{ abs_pt }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OceanView 2">
<meta property="og:title" content="{{ titulo }} · OceanView 2">
<meta property="og:description" content="{{ descricao }}">
<meta property="og:url" content="{{ abs_atual }}">
<meta property="og:image" content="{{ abs_raiz }}assets/img/{% pt %}og-oceanview2.jpg{% en %}og-oceanview2-en.jpg{% fim %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{% pt %}pt_PT{% en %}en_GB{% fim %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F2E4C">
<link rel="icon" href="{{ base }}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ base }}assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ base }}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{ base }}assets/fonts/italiana.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base }}assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ base }}assets/css/letras.css">
<link rel="stylesheet" href="{{ base }}assets/css/base.css">
{{ css_extra }}
<script src="{{ base }}config.js" defer></script>
<script src="{{ base }}assets/js/cabecalho.js" defer></script>
<script src="{{ base }}assets/js/formulario.js" defer></script>
<script src="{{ base }}assets/js/cookies.js" defer></script>
{{ js_extra }}
</head>
<body class="{{ classe }}" data-lang="{{ lang }}" data-base="{{ base }}">
<a class="saltar" href="#conteudo">{{ t.nav.saltar }}</a>
{% incluir cabecalho %}
<main id="conteudo" tabindex="-1">
{{ conteudo }}
</main>
{% incluir rodape %}
{% incluir cookies %}
</body>
</html>
